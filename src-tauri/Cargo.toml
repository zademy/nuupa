[package]
name = "nuupa"
version = "0.4.1"
description = "Nuupa — app de escritorio para ver y actualizar los paquetes globales de npm, pnpm y bun"
license = "AGPL-3.0-or-later"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nuupa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Proveedor remoto de habilidades (#27): HTTP síncrono sin auth (ureq)
# y tarball .tar.gz de GitHub (flate2 + tar), siempre en spawn_blocking.
ureq = "2.10"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.27.0"

# Señal cortés (SIGTERM) de la escalada de finalización de procesos (#11).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

