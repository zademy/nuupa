name: build

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
  # Sin trigger de tags: los tags v* los crea CI al publicar la release en
  # master. Un trigger de tags re-dispararía este workflow en bucle (el tag
  # creado por la API genera un evento push de tag).

# Un run nuevo cancela el anterior de la misma rama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio (#18): solo lectura por defecto; escritura ÚNICAMENTE
# en los jobs que la necesitan (sanidad estampa y pushea el commit de
# release; publicar-release crea el tag y la release). Las acciones van
# fijadas por SHA: una tag comprometida no ejecuta código aquí — cada
# actualización es un diff visible con su versión al lado.
permissions:
  contents: read

jobs:
  # Verificación barata (segundos en ubuntu) ANTES de gastar runners:
  # tauri.conf.json y Cargo.toml deben llevar LA MISMA versión (tauri.conf
  # manda: es la que usa el bundler).
  #
  # En master, además, deriva la versión del release AL ESTILO SPRING BOOT:
  # los merges jamás cargan bumps — el proceso de release es quien estampa
  # la versión (allí main lleva 4.2.0-SNAPSHOT y ningún PR toca version=).
  # Consecutivo del último tag (patch +1); si los archivos traen una
  # versión MAYOR, esa gana (intención explícita de minor/major). El
  # estampado se commitea con [skip ci] — y los pushes del GITHUB_TOKEN no
  # disparan workflows — para que el tag final CONTENGA su propia versión.
  sanidad:
    runs-on: ubuntu-latest
    # (#18) Escritura: en master estampa la versión y PUSHEA el commit de
    # release a master.
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # historial y tags completos para derivar

      - name: Versiones consistentes
        run: |
          V_JSON=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          V_CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$V_JSON  Cargo.toml=$V_CARGO"
          [ "$V_JSON" = "$V_CARGO" ] || { echo "::error::Cargo.toml ($V_CARGO) != tauri.conf.json ($V_JSON)"; exit 1; }

      - name: Derivar versión y estamparla (solo master)
        id: version
        if: github.ref == 'refs/heads/master'
        run: |
          # Anti-repetición: un re-run de un run que ya publicó no debe
          # generar OTRA release — si este merge ya fue estampado, salir.
          if git log --format=%B origin/master | grep -qF "Release-of: $GITHUB_SHA"; then
            echo "Este commit ya tiene su release; no se estampa de nuevo."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags origin
          LATEST=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          V_JSON=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          NEXT=$(python3 - "$LATEST" "$V_JSON" <<'PY'
          import sys
          def key(v):
              core = v.split('-')[0].split('.')
              parts = [int(p) for p in core] + [0] * (3 - len(core))
              return tuple(parts)
          latest, files = sys.argv[1], sys.argv[2]
          # Los archivos mandan solo si traen una versión MAYOR; si no,
          # consecutivo del último tag publicado.
          if not latest or key(files) > key(latest):
              print(files)
          else:
              a, b, c = key(latest)
              print(f"{a}.{b}.{c + 1}")
          PY
          )
          echo "Último tag: ${LATEST:-ninguno} → release: v$NEXT"
          # Estampar los tres archivos preservando el formato de cada uno.
          # Idempotente: si ya llevan la versión derivada (la de los
          # archivos ganó), no hay nada que cambiar.
          python3 - "$NEXT" <<'PY'
          import re, sys
          nex = sys.argv[1]

          def estampar(path, patron):
              s = open(path).read()
              m = re.search(patron, s, flags=re.M)
              assert m, f'{path}: no se encontró la versión'
              if m.group(2) == nex:
                  return
              inicio, fin = m.start(2), m.end(2)
              open(path, 'w').write(s[:inicio] + nex + s[fin:])

          estampar('src-tauri/tauri.conf.json', r'("version"\s*:\s*")([^"]+)(")')
          estampar('src-tauri/Cargo.toml', r'(^version\s*=\s*")([^"]+)(")')

          p = 'src-tauri/Cargo.lock'
          lines = open(p).read().split('\n')
          for i, ln in enumerate(lines):
              if ln == 'name = "nuupa"':
                  assert lines[i + 1].startswith('version = '), 'Cargo.lock: bloque nuupa sin version'
                  if lines[i + 1].split('"')[1] != nex:
                      lines[i + 1] = f'version = "{nex}"'
                      open(p, 'w').write('\n'.join(lines))
                  break
          else:
              raise SystemExit('Cargo.lock: no se encontró el paquete nuupa')
          PY
          V_JSON=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          V_CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$V_JSON" = "$NEXT" ] && [ "$V_CARGO" = "$NEXT" ] || {
            echo "::error::El estampado no quedó consistente ($V_JSON/$V_CARGO != $NEXT)"; exit 1;
          }
          git config user.name "nuupa-ci"
          git config user.email "actions@github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            # El merge ya traía la versión derivada: el merge commit ES el
            # commit de release — nada que estampar.
            echo "Los archivos ya llevan v$NEXT; el merge commit es el release commit."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): v$NEXT [skip ci]" -m "Release-of: $GITHUB_SHA"
            git push origin HEAD:master
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "publicar=true" >> "$GITHUB_OUTPUT"

  # Tests de verdad: Rust y frontend, en develop Y master. Un test roto no
  # debería llegar ni a construirse. CORRE EN AMBAS RAMAS a propósito:
  # ningún job de esta cadena se salta por rama, así los skips en cascada
  # de `needs` (GitHub salta dependientes cuyo if no consulta estado) no
  # pueden morder, y todo release se publica con su suite verde.
  tests:
    needs: sanidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # En master: el SHA estampado (la versión ya va dentro).
          ref: ${{ needs.sanidad.outputs.ref || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch movible)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Las mismas dependencias de WebKitGTK que el build: compilar el
      # crate de tauri (cargo test) las necesita en Linux.
      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Formato y lint ANTES de los tests: Prettier es el dueño del formato
      # del frontend, ESLint de la calidad (sus reglas de estilo están
      # apagadas vía eslint-config-prettier — jamás chocan). En Rust,
      # rustfmt y clippy cumplen el mismo papel.
      - name: Frontend (formato y lint)
        run: |
          npm ci
          npm run format:check
          npm run lint

      - name: Frontend (vitest)
        run: npm test

      - name: Rust (formato y lint)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Construye los bundles por plataforma. En develop valida antes de
  # mergear; en master reconstruye para publicar: la release usa LOS
  # instaladores de su propio run (predecible, sin saltos entre runs).
  build:
    needs: [tests, sanidad]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: binario UNIVERSAL compilado en el runner ARM (Intel +
          # Apple Silicon en un solo .app/.dmg). Los runners Intel
          # (macos-13) fueron retirados por GitHub en dic 2025.
          - os: macos-latest
            label: macos-universal
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          # Linux: x64 normal + arm64 (runner público de GitHub)
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          # Windows: x64 normal + arm64 (runner público de GitHub)
          - { os: windows-latest, label: windows-x64 }
          - { os: windows-11-arm, label: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # En master: el SHA estampado (la versión ya va dentro).
          ref: ${{ needs.sanidad.outputs.ref || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch movible)
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Dependencias de WebKitGTK para el bundling de Linux (ambas arqs).
      # xdg-utils: el empaquetado del .deb requiere xdg-open (plugin opener).
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xdg-utils

      - name: Dependencias del frontend
        run: npm ci

      # Sin tagName: tauri-action SOLO construye (bundle.targets: "all"
      # genera dmg / msi + exe NSIS / deb + rpm + AppImage según el SO).
      - name: Construir y empaquetar
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}

      # Solo instaladores: el .app suelto de macOS ya va dentro del .dmg.
      # El ** cubre el target-dir extra del build universal
      # (target/universal-apple-darwin/release/bundle/...).
      - name: Subir instaladores
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuupa-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Merge a master = publicar. Usa los instaladores que ESTE run acaba de
  # construir, crea el tag v{versión} en el commit estampado y publica la
  # release con notas y checksums.
  publicar-release:
    needs: [build, sanidad]
    # If de rama + estado explícito de la derivación: si este merge ya
    # publicó su release (re-run), no se publica otra vez. Consulta estado
    # a propósito — es un skip intencional, no uno en cascada.
    if: github.ref == 'refs/heads/master' && needs.sanidad.outputs.publicar != 'false'
    runs-on: ubuntu-latest
    # (#18) Escritura: crea el tag v* y publica la release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.sanidad.outputs.version }}
      REF: ${{ needs.sanidad.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # historial completo para las notas
          ref: ${{ needs.sanidad.outputs.ref }}

      - name: Descargar instaladores
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nuupa-*
          merge-multiple: true
          path: instaladores

      - name: Preparar assets (aplanar, validar y checksums)
        run: |
          mkdir assets
          # Cada artefacto llega anidado; se aplana a un solo directorio.
          find instaladores -type f -regextype posix-extended \
            -regex '.*\.(dmg|msi|exe|deb|rpm|AppImage)' -exec mv {} assets/ \;
          # Equivalente a fail_on_unmatched_files: si falta cualquier
          # familia de instalador, la release no se publica a medias.
          for ext in dmg msi exe deb rpm AppImage; do
            ls assets/*."$ext" >/dev/null 2>&1 || {
              echo "::error::Faltan instaladores *.$ext"; ls -la assets; exit 1;
            }
          done
          (cd assets && sha256sum * > SHASUMS256.txt)
          ls -la assets

      - name: Notas con todos los commits
        run: |
          TAG="v$VERSION"
          # Tag anterior (si existe) para acotar el rango de commits; el tag
          # nuevo todavía no existe — el rango termina en HEAD (estampado).
          PREV=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          RANGO="${PREV:+$PREV..}HEAD"
          {
            echo "## Commits incluidos"
            echo
            git log --pretty=format:'- %s (%h)' "$RANGO"
            echo
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          } > notas.md

      - name: Publicar release (crea el tag en el commit estampado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          # v1.2.3-rc.1 / -beta / -alpha → prerelease; resto → latest
          FLAGS="--latest"
          if echo "$TAG" | grep -Eq '[-.](rc|beta|alpha)'; then
            FLAGS="--prerelease"
          fi
          # --target crea el tag en el SHA estampado de master si no existe:
          # tag y release nacen juntos, nadie pushea tags a mano.
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REF" \
            --title "Nuupa $TAG" \
            --notes-file notas.md $FLAGS
