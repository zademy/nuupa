name: build

on:
  push:
    branches: [develop, master]
  workflow_dispatch:
  # Sin trigger de tags: los tags v* los crea CI al publicar la release en
  # master. Un trigger de tags re-dispararía este workflow en bucle (el tag
  # creado por la API genera un evento push de tag).

# Un run nuevo cancela el anterior de la misma rama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Verificación barata (segundos en ubuntu) ANTES de gastar runners:
  # tauri.conf.json y Cargo.toml deben llevar LA MISMA versión (tauri.conf
  # manda: es la que usa el bundler). En master, además, el tag que se va a
  # crear debe ser NUEVO — si ya existe, el merge no trajo un bump de
  # versión y la release se queda sin poder publicarse.
  sanidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versiones consistentes
        run: |
          V_JSON=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          V_CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$V_JSON  Cargo.toml=$V_CARGO"
          [ "$V_JSON" = "$V_CARGO" ] || { echo "::error::Cargo.toml ($V_CARGO) != tauri.conf.json ($V_JSON)"; exit 1; }

      - name: El tag v$V_JSON debe ser nuevo (solo master)
        if: github.ref == 'refs/heads/master'
        run: |
          V_JSON=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="v$V_JSON"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::El tag $TAG ya existe: sube la versión en develop antes de mergear a master."
            exit 1
          fi
          echo "Se creará el tag $TAG al publicar la release."

  # Tests de verdad (solo develop): Rust y frontend. Un test roto no
  # debería llegar ni a construirse.
  tests:
    needs: sanidad
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Las mismas dependencias de WebKitGTK que el build: compilar el
      # crate de tauri (cargo test) las necesita en Linux.
      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Frontend (vitest)
        run: |
          npm ci
          npm test

      - name: Rust (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Construye los bundles por plataforma (solo develop) y los deja como
  # artefactos: la release en master los REUTILIZA, no se reconstruye nada.
  build:
    needs: tests
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: binario UNIVERSAL compilado en el runner ARM (Intel +
          # Apple Silicon en un solo .app/.dmg). Los runners Intel
          # (macos-13) fueron retirados por GitHub en dic 2025.
          - os: macos-latest
            label: macos-universal
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          # Linux: x64 normal + arm64 (runner público de GitHub)
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          # Windows: x64 normal + arm64 (runner público de GitHub)
          - { os: windows-latest, label: windows-x64 }
          - { os: windows-11-arm, label: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Dependencias de WebKitGTK para el bundling de Linux (ambas arqs).
      # xdg-utils: el empaquetado del .deb requiere xdg-open (plugin opener).
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xdg-utils

      - name: Dependencias del frontend
        run: npm ci

      # Sin tagName: tauri-action SOLO construye (bundle.targets: "all"
      # genera dmg / msi + exe NSIS / deb + rpm + AppImage según el SO).
      - name: Construir y empaquetar
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      # Solo instaladores: el .app suelto de macOS ya va dentro del .dmg.
      # El ** cubre el target-dir extra del build universal
      # (target/universal-apple-darwin/release/bundle/...).
      - name: Subir instaladores
        uses: actions/upload-artifact@v7
        with:
          name: nuupa-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Merge a master = publicar. NO construye: descarga los instaladores del
  # run de develop que construyó exactamente el commit fusionado, crea el
  # tag v{versión} en este SHA y publica la release con notas y checksums.
  publicar-release:
    needs: sanidad
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: padres del merge y notas

      # El commit de develop que se fusionó: si es fast-forward, el propio
      # HEAD; si es merge commit, su segundo padre (la punta de develop).
      # NOTA: merge normal o fast-forward — un squash-merge rompería esta
      # resolución (y el job fallaría ruidosamente, que es lo correcto).
      - name: Resolver el commit de develop fusionado
        run: |
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            SHA=$(git rev-parse HEAD^2)
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "SHA_DEVELOP=$SHA" >> "$GITHUB_ENV"
          echo "Artefactos del run de develop para: $SHA"

      - name: Hallar el run de build que construyó ese commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=develop&status=success" \
            --jq ".workflow_runs | map(select(.head_sha == \"$SHA_DEVELOP\")) | .[0].id")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No hay run exitoso de build en develop para $SHA_DEVELOP. Todo cambio debe pasar por develop antes de master."
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Run de develop: $RUN_ID"

      - name: Descargar instaladores
        uses: actions/download-artifact@v8
        with:
          pattern: nuupa-*
          merge-multiple: true
          path: instaladores
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Preparar assets (aplanar, validar y checksums)
        run: |
          mkdir assets
          # Cada artefacto llega anidado; se aplana a un solo directorio.
          find instaladores -type f -regextype posix-extended \
            -regex '.*\.(dmg|msi|exe|deb|rpm|AppImage)' -exec mv {} assets/ \;
          # Equivalente a fail_on_unmatched_files: si falta cualquier
          # familia de instalador, la release no se publica a medias.
          for ext in dmg msi exe deb rpm AppImage; do
            ls assets/*."$ext" >/dev/null 2>&1 || {
              echo "::error::Faltan instaladores *.$ext"; ls -la assets; exit 1;
            }
          done
          (cd assets && sha256sum * > SHASUMS256.txt)
          ls -la assets

      - name: Notas con todos los commits
        run: |
          TAG="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          # Tag anterior (si existe) para acotar el rango de commits; el tag
          # nuevo todavía no existe — el rango termina en HEAD.
          PREV=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          RANGO="${PREV:+$PREV..}HEAD"
          {
            echo "## Commits incluidos"
            echo
            git log --pretty=format:'- %s (%h)' "$RANGO"
            echo
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          } > notas.md

      - name: Publicar release (crea el tag en este SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          # v1.2.3-rc.1 / -beta / -alpha → prerelease; resto → latest
          FLAGS="--latest"
          if echo "$TAG" | grep -Eq '[-.](rc|beta|alpha)'; then
            FLAGS="--prerelease"
          fi
          # --target crea el tag en el SHA de master si no existe: tag y
          # release nacen juntos, nadie pushea tags a mano.
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nuupa $TAG" \
            --notes-file notas.md $FLAGS
